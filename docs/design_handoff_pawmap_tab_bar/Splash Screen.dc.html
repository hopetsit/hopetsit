<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E4D8;font-family:Manrope,system-ui,sans-serif;color:#1E1B18;display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 0}
a{color:#D83C28}a:hover{color:#B92425}
@keyframes pinIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes toe1{0%{transform:translate(78px,48.8px) scale(.25);opacity:0}100%{transform:none;opacity:1}}
@keyframes toe2{0%{transform:translate(30px,87px) scale(.25);opacity:0}100%{transform:none;opacity:1}}
@keyframes toe3{0%{transform:translate(-30px,87px) scale(.25);opacity:0}100%{transform:none;opacity:1}}
@keyframes toe4{0%{transform:translate(-78px,48.8px) scale(.25);opacity:0}100%{transform:none;opacity:1}}
@keyframes fadeUp{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</helmet>
<div data-screen-label="Splash" style="position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:linear-gradient(165deg,#F26A46 0%,#DD4430 45%,#C7311F 100%);box-shadow:0 24px 60px rgba(30,27,24,.25)">
  <div style="position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;color:#fff;font-size:16px;font-weight:700">
    <span>9:41</span>
    <span style="width:70px;height:12px;border-radius:6px;background:rgba(255,255,255,.55)"></span>
  </div>
  <sc-if value="{{ show }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:50%;top:250px;width:210px;height:210px;margin-left:-105px;animation:pinIn .7s cubic-bezier(.3,1.5,.4,1) both">
      <div style="position:absolute;inset:0;animation:float 3.2s ease-in-out 1.6s infinite">
        <span style="position:absolute;left:10px;top:84.2px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF7A66,#D83C28);border:5px solid #fff;box-shadow:0 10px 24px rgba(120,20,10,.35);animation:toe1 .65s cubic-bezier(.3,1.5,.4,1) .55s both"></span>
        <span style="position:absolute;left:55px;top:43px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6FA0FF,#2F6FD6);border:5px solid #fff;box-shadow:0 10px 24px rgba(120,20,10,.35);animation:toe2 .65s cubic-bezier(.3,1.5,.4,1) .65s both"></span>
        <span style="position:absolute;left:115px;top:43px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7FD66F,#3FA33A);border:5px solid #fff;box-shadow:0 10px 24px rgba(120,20,10,.35);animation:toe3 .65s cubic-bezier(.3,1.5,.4,1) .75s both"></span>
        <span style="position:absolute;left:166px;top:84.2px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#B57FE6,#7A3FB0);border:5px solid #fff;box-shadow:0 10px 24px rgba(120,20,10,.35);animation:toe4 .65s cubic-bezier(.3,1.5,.4,1) .85s both"></span>
        <div style="position:absolute;left:50%;bottom:0;width:120px;height:120px;margin-left:-60px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(135deg,#3A363F,#17151A);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 30px 60px rgba(90,15,8,.5);border:6px solid #fff;display:flex;align-items:center;justify-content:center;overflow:hidden">
          <div style="width:80px;height:80px;border-radius:40px;overflow:hidden;transform:rotate(45deg);box-shadow:0 4px 12px rgba(0,0,0,.4);background:#17151A"><img src="HoPetSit_logo.png" alt="" style="width:200px;height:200px;object-fit:cover;margin:-60px 0 0 -60px"></div>
        </div>
      </div>
    </div>
    <div style="position:absolute;left:0;right:0;top:500px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:fadeUp .6s ease-out 1.1s both">
      <div style="font-size:44px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1">HoPetSit</div>
      <div style="font-size:17px;font-weight:500;letter-spacing:.06em;color:rgba(255,255,255,.8)">Home Pets Sitting</div>
    </div>
    <div style="position:absolute;left:50%;bottom:110px;width:34px;height:34px;margin-left:-17px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .9s linear infinite,fadeUp .5s ease-out 1.5s both"></div>
  </sc-if>
  <div style="position:absolute;left:50%;bottom:10px;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:#fff;opacity:.9"></div>
</div>
<button onClick="{{ replay }}" style="border:0;background:#1E1B18;color:#fff;font-family:inherit;font-weight:700;font-size:13px;padding:10px 18px;border-radius:999px;cursor:pointer">Rejouer l'animation</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:470,&quot;height&quot;:960}}">
class Component extends DCLogic {
  state = { show: true };
  renderVals() {
    return {
      show: this.state.show,
      replay: () => { this.setState({ show: false }); setTimeout(() => this.setState({ show: true }), 60); }
    };
  }
}
</script>
</body>
</html>
