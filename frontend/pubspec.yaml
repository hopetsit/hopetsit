dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  # Session v16-1b ??? official HopeTSIT logo integration. flutter_launcher_icons
  # reads the PNG source files under assets/brand/png/ and generates every
  # Android mipmap-* density + iOS AppIcon.appiconset size automatically.
  # Run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

# flutter_launcher_icons config ??? single source of truth for app icons.
# The SVGs in assets/brand/{android,apple}/ stay for reference (and future
# manual edits); what the plugin actually uses are the 1024x1024 PNG rasters
# generated under assets/brand/png/.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/png/ic_launcher.png"
  image_path_ios: "assets/brand/png/apple-icon-original.png"
  # iOS 18 delivers 3 appearance variants (default / dark / tinted).
  # The plugin ??? 0.14 picks them up automatically and writes the right
  # metadata in AppIcon.appiconset/Contents.json.
  image_path_ios_dark_transparent_background: "assets/brand/png/apple-icon-dark.png"
  image_path_ios_tinted_grayscale: "assets/brand/png/apple-icon-white.png"
  # Android 8+ adaptive icons: separate foreground + solid orange background.
  adaptive_icon_foreground: "assets/brand/png/ic_launcher_foreground.png"
  # v532b — Daniel : « le logo ne fait pas HD, il manque les beaux contours
  # colorés ». CAUSE : Android ne garantit que les 66 % CENTRAUX d'une icône
  # adaptative ; tout ce qui dépasse est rogné par le masque du lanceur
  # (cercle, squircle, goutte…). Notre calque avant occupait 94,9 % du cadre,
  # donc le halo néon orange — qui vit précisément sur le bord — était mangé.
  # Le fichier source place désormais le logo à exactement 66 % ; on met donc
  # l'inset du plugin à 0 pour qu'il ne le réduise pas une seconde fois.
  adaptive_icon_foreground_inset: 0
  # v533 — Daniel : « je veux pas de noir du tout, je veux le contour seul
  # brillant ». Fond BLANC : plus de carré noir autour de l'icône, seul le
  # bouclier au halo orange ressort. (La v532 utilisait le noir du master du
  # pack ; l'orange historique, lui, noyait le halo dans l'arrière-plan.)
  adaptive_icon_background: "#FFFFFF"
  # Monochrome variant for Android 13+ themed icons. Uses the foreground
  # layer since the notification SVG is already optimised for a single colour.
  adaptive_icon_monochrome: "assets/brand/png/ic_launcher_foreground.png"
  # Disable the alpha stripper on iOS (Apple rejected  historically; our source PNGs don't have transparency anyway).
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/guest/
    - assets/icons/
    - assets/brand/
    - assets/brand/android/
    - assets/brand/apple/
    - assets/brand/web/
    - assets/brand/png/
    - .env
