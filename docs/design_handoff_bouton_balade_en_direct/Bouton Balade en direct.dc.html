<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:radial-gradient(circle at 50% 35%, #F7FCF2 0%, #DCF1D1 100%);font-family:'Nunito',sans-serif}
a{color:#2E9E4F}a:hover{color:#237A3C}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.65);opacity:0}}
@keyframes dot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.5);opacity:.5}}
@keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-6px) rotate(var(--r))}}
@keyframes shine{0%{transform:translateX(-160%) rotate(20deg)}60%,100%{transform:translateX(220%) rotate(20deg)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.95}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;box-sizing:border-box">
  <div style="position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center">
    {{ glow }}
    {{ paws }}
    {{ leaves }}
    <button onClick="{{ toggle }}" aria-label="Balade en direct" style="position:relative;width:144px;height:144px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 25%, #95F0A4 0%, #48CB68 40%, #28A04A 100%);color:#fff;font-family:'Nunito',sans-serif;font-weight:900;cursor:pointer;overflow:hidden;box-shadow:inset 0 -7px 0 rgba(0,0,0,.14), inset 0 3px 0 rgba(255,255,255,.45), 0 8px 0 #1E7A38, 0 22px 36px rgba(42,160,75,.45);transition:transform .15s,box-shadow .15s" style-hover="transform:translateY(3px);box-shadow:inset 0 -7px 0 rgba(0,0,0,.14), inset 0 3px 0 rgba(255,255,255,.45), 0 5px 0 #1E7A38, 0 15px 26px rgba(42,160,75,.45)" style-active="transform:translateY(8px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14), inset 0 3px 0 rgba(255,255,255,.3), 0 0 0 #1E7A38, 0 4px 12px rgba(42,160,75,.3)">
      {{ rings }}
      {{ dash }}
      {{ shine }}
      <span style="position:relative;display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 40% 30%, #E9D5FF 0%, #9B5CF6 58%, #7C3AED 100%);box-shadow:0 4px 0 #5B21B6, 0 9px 14px rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.75), 0 0 0 3px rgba(255,255,255,.35)">{{ dog }}</span>
      <span style="position:relative;display:flex;align-items:center;gap:5px;margin-top:8px;margin-bottom:2px;padding:3px 9px 3px 7px;border-radius:999px;background:#17692F;box-shadow:inset 0 1px 0 rgba(0,0,0,.25), 0 1px 0 rgba(255,255,255,.25);font-size:8.5px;letter-spacing:1.6px;text-transform:uppercase;color:#fff">
        {{ liveDot }} {{ status }}
      </span>
      <span style="position:relative;display:flex;align-items:baseline;gap:4px;line-height:1">
        <span style="font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-1px;text-shadow:0 2px 0 rgba(0,0,0,.2)">{{ elapsed }}</span>
        <span style="font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#E3FBDA">{{ unit }}</span>
      </span>
      <span style="position:relative;margin-top:1px;font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.6px;color:#E3FBDA">{{ secs }}</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:360}}">
class Component extends DCLogic {
  state = { live: true, seconds: 0 };
  componentDidMount() { this.timer = setInterval(() => { if (this.state.live) this.setState(s => ({ seconds: s.seconds + 1 })); }, 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const live = this.state.live;
    const m = Math.floor(this.state.seconds / 60);
    const h = React.createElement;
    const rings = null;
    const dash = null;
    const shine = null;
    const glow = null;
    const liveDot = h('span',{style:{width:7,height:7,borderRadius:'50%',background:live?'#C9A8FF':'#ECFFE4',boxShadow:live?'0 0 0 2px rgba(201,168,255,.35)':'none',animation:live?'dot 1.1s ease-in-out infinite':'none',display:'inline-block'}});
    const dog = h('svg',{width:50,height:50,viewBox:'0 0 48 48',style:{display:'block',overflow:'visible',animation:live?'wobble .9s ease-in-out infinite':'none',transformOrigin:'50% 85%'}},
      h('defs',null,
        h('radialGradient',{id:'dogHead',cx:'38%',cy:'26%',r:'80%'}, h('stop',{offset:'0',stopColor:'#FFE0B0'}), h('stop',{offset:'1',stopColor:'#F0A455'})),
        h('linearGradient',{id:'dogEar',x1:'0',y1:'0',x2:'0',y2:'1'}, h('stop',{offset:'0',stopColor:'#B9713F'}), h('stop',{offset:'1',stopColor:'#7E4522'})),
        h('radialGradient',{id:'dogMuzzle',cx:'45%',cy:'25%',r:'85%'}, h('stop',{offset:'0',stopColor:'#FFFFFF'}), h('stop',{offset:'1',stopColor:'#FFE9CC'}))),
      h('path',{d:'M14 12c-5.5-1.8-10 2.6-10 9 0 6 2.6 12 6.4 13 2.8.7 5.6-1.2 5.6-5V17c0-2.3-.8-4.2-2-5z',fill:'url(#dogEar)'}),
      h('path',{d:'M34 12c5.5-1.8 10 2.6 10 9 0 6-2.6 12-6.4 13-2.8.7-5.6-1.2-5.6-5V17c0-2.3.8-4.2 2-5z',fill:'url(#dogEar)'}),
      h('path',{d:'M24 7.5c-9 0-14 6.2-14 15 0 7.4 5 14 14 14s14-6.6 14-14c0-8.800-5-15-14-15z',fill:'url(#dogHead)'}),
      h('path',{d:'M27 9.500c5.500 1 9.500 5 10.500 11 .3 2-.6 4-2.500 4.800-3 1.200-6.500-.3-8-3.300-1.800-3.600-2-8.500 0-12.500z',fill:'#D98A45',opacity:.75}),
      h('path',{d:'M24 8c-1.600 3.500-2 8-1.300 13h2.600C26 16 25.600 11.500 24 8z',fill:'#FFF6E6'}),
      h('ellipse',{cx:18,cy:12.500,rx:4.500,ry:2,fill:'rgba(255,255,255,.4)',transform:'rotate(-22 18 12.500)'}),
      h('path',{d:'M24 20.500c-5 0-8.600 3.200-8.600 7.300 0 4.300 3.600 8 8.600 8s8.600-3.700 8.600-8c0-4.100-3.600-7.300-8.600-7.300z',fill:'url(#dogMuzzle)'}),
      h('ellipse',{cx:18.300,cy:20,rx:2.900,ry:3.300,fill:'#3A2318'}),
      h('ellipse',{cx:29.700,cy:20,rx:2.900,ry:3.300,fill:'#3A2318'}),
      h('circle',{cx:19.400,cy:18.600,r:1.150,fill:'#fff'}),
      h('circle',{cx:30.800,cy:18.600,r:1.150,fill:'#fff'}),
      h('circle',{cx:17.400,cy:21.400,r:.55,fill:'#fff',opacity:.7}),
      h('circle',{cx:28.800,cy:21.400,r:.55,fill:'#fff',opacity:.7}),
      h('path',{d:'M15 15.200c1.300-1.100 3.200-1.300 4.700-.5M28.300 14.700c1.500-.8 3.400-.6 4.700.5',stroke:'#7E4522',strokeWidth:1.300,strokeLinecap:'round',fill:'none'}),
      h('ellipse',{cx:14.300,cy:26,rx:2.200,ry:1.300,fill:'#FF8FA8',opacity:.6}),
      h('ellipse',{cx:33.700,cy:26,rx:2.200,ry:1.300,fill:'#FF8FA8',opacity:.6}),
      h('path',{d:'M24 24c-2.400 0-4 1.200-4 2.800 0 1.200 1.100 2.200 2.500 2.800l1.500.7 1.500-.7c1.400-.6 2.500-1.600 2.500-2.800 0-1.600-1.600-2.800-4-2.800z',fill:'#3A2318'}),
      h('ellipse',{cx:22.800,cy:25.400,rx:.95,ry:.55,fill:'#fff',opacity:.8}),
      h('path',{d:'M24 30.300v1.500M24 31.800c-1.600 2-3.700 2-5 .6M24 31.800c1.600 2 3.700 2 5 .6',stroke:'#3A2318',strokeWidth:1.400,strokeLinecap:'round',fill:'none'}),
      h('path',{d:'M21.800 32.800c0 2.800 1 5 2.200 5s2.200-2.200 2.200-5c-.7-.6-3.700-.6-4.400 0z',fill:'#FF6B8A'}),
      h('path',{d:'M24 33.300v3',stroke:'#E04A6C',strokeWidth:.7,strokeLinecap:'round'}));
    const C = 2*Math.PI*84;
    const ring = h('svg',{width:180,height:180,viewBox:'0 0 180 180',style:{position:'absolute',left:40,top:40,pointerEvents:'none',transform:'rotate(-90deg)'}},
      h('circle',{cx:90,cy:90,r:84,fill:'none',stroke:'rgba(61,190,94,.2)',strokeWidth:5}),
      live ? h('circle',{cx:90,cy:90,r:84,fill:'none',stroke:'#9B5CF6',strokeWidth:5,strokeLinecap:'round',strokeDasharray:C,strokeDashoffset:C*(1-(this.state.seconds%60)/60),style:{transition:(this.state.seconds%60)===0?'none':'stroke-dashoffset 1s linear'}}) : null);
    const paw = (a,sz,c,d) => h('span',{key:a,style:{position:'absolute',inset:0,animation:`orbit ${18+d*3}s linear infinite`,transform:`rotate(${a}deg)`,pointerEvents:'none'}},
      h('svg',{width:sz,height:sz,viewBox:'0 0 24 24',fill:c,style:{position:'absolute',left:'50%',top:130-102-sz/2,marginLeft:-sz/2,transform:`rotate(${a}deg)`,opacity:.9}},
        h('ellipse',{cx:12,cy:14,rx:3.2,ry:3.6}), h('circle',{cx:7,cy:9.5,r:1.9}), h('circle',{cx:17,cy:9.5,r:1.9}), h('circle',{cx:9.5,cy:5.5,r:1.8}), h('circle',{cx:14.5,cy:5.5,r:1.8})));
    const paws = live ? h('span',{style:{position:'absolute',inset:0,pointerEvents:'none'}}, [paw(0,16,'#6FD98A',0), paw(90,12,'#9B5CF6',1), paw(180,16,'#8EEB9E',0), paw(270,12,'#B388FF',1)]) : null;
    const leaf = (x,y,r,sz,c,d) => h('svg',{key:x+''+y,width:sz,height:sz,viewBox:'0 0 24 24',style:{position:'absolute',left:x,top:y,'--r':r+'deg',animation:`float ${3+d}s ${d*0.5}s ease-in-out infinite`,pointerEvents:'none',filter:'drop-shadow(0 3px 4px rgba(30,122,56,.25))'}},
      h('path',{d:'M3 21c0-9 7-16 18-18-1 11-8 18-18 18z',fill:c}), h('path',{d:'M4 20L19 5',stroke:'rgba(255,255,255,.6)',strokeWidth:1.3,strokeLinecap:'round'}));
    const onRing = (deg, sz) => { const r = 114, a = deg*Math.PI/180; return [130 + r*Math.cos(a) - sz/2, 130 + r*Math.sin(a) - sz/2]; };
    const L = (deg, rot, sz, c, d) => { const [x,y] = onRing(deg, sz); return leaf(x, y, rot, sz, c, d); };
    const leaves = live ? [L(225,-25,26,'#6FD98A',0), L(315,40,22,'#9B5CF6',1), L(45,120,20,'#8EEB9E',2), L(135,-110,18,'#B388FF',1.5)] : null;
    return {
      live, rings, dash, shine, glow, liveDot, dog, paws, leaves, ring,
      elapsed: live ? String(m) : '—',
      unit: live ? 'min' : '',
      secs: live ? `${String(this.state.seconds % 60).padStart(2,'0')} s` : '',
      status: live ? 'En direct' : 'Hors ligne',
      toggle: () => this.setState(s => ({ live: !s.live }))
    };
  }
}
</script>
</body>
</html>
