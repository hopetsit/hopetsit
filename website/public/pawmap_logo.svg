<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pmDisc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#22A0A8"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="pmPin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F4EA"/>
    </linearGradient>
    <radialGradient id="pmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.62" stop-color="#22A0A8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22A0A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- halo doux bleu-vert -->
  <circle cx="256" cy="256" r="254" fill="url(#pmGlow)"/>

  <!-- disque dégradé bleu→vert + liseré blanc -->
  <circle cx="256" cy="256" r="232" fill="url(#pmDisc)"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.95"/>
  <circle cx="256" cy="256" r="196" fill="url(#pmDisc)"/>

  <!-- pin de localisation blanc (carte) -->
  <path d="M 256 392
           C 232 352 158 296 158 220
           A 98 98 0 1 1 354 220
           C 354 296 280 352 256 392 Z"
        fill="url(#pmPin)"/>

  <!-- patte centrale (bleu côté gauche, vert côté droit via groupes) -->
  <g>
    <!-- coussinets — chien (bleu) à gauche, chat (vert) à droite -->
    <ellipse cx="210" cy="182" rx="13" ry="19" transform="rotate(-22 210 182)" fill="#2563EB"/>
    <ellipse cx="238" cy="166" rx="13" ry="20" transform="rotate(-7 238 166)" fill="#2563EB"/>
    <ellipse cx="274" cy="166" rx="13" ry="20" transform="rotate(7 274 166)" fill="#16A34A"/>
    <ellipse cx="302" cy="182" rx="13" ry="19" transform="rotate(22 302 182)" fill="#16A34A"/>
    <!-- grand coussinet : moitié bleu / moitié vert -->
    <path d="M 256 198
             C 232 198 214 214 214 235
             C 214 256 232 266 256 266 Z" fill="#2563EB"/>
    <path d="M 256 198
             C 280 198 298 214 298 235
             C 298 256 280 266 256 266 Z" fill="#16A34A"/>
  </g>

  <!-- mini chien (bleu) + chat (vert) sous la patte -->
  <g transform="translate(206 296)" fill="#2563EB">
    <!-- chien : tête + oreilles tombantes -->
    <circle cx="0" cy="6" r="13"/>
    <path d="M -12 -2 q -8 -8 -3 4 q 5 6 8 0 Z"/>
    <path d="M 12 -2 q 8 -8 3 4 q -5 6 -8 0 Z"/>
  </g>
  <g transform="translate(306 296)" fill="#16A34A">
    <!-- chat : tête + oreilles pointues -->
    <circle cx="0" cy="6" r="13"/>
    <path d="M -11 -4 l -2 -12 l 9 7 Z"/>
    <path d="M 11 -4 l 2 -12 l -9 7 Z"/>
  </g>
</svg>
